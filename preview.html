<title>Wordezy Search</title>

<style>
  /*
    Layout concept: a single centered "puzzle card" column — wordmark + mode
    switch up top, the letter grid as the visual anchor in the middle, the
    word list as a companion rail beside it (stacks below on phone).
    Palette matches Wordezy's brand (deliberately dark-first: a lamplit
    study-table aesthetic for a word game, not a generic dark UI).
  */
  :root {
    --ink: #0b0a08;
    --surface: #141310;
    --surface-high: #1b1915;
    --rule: #2a271f;
    --paper: #f3efe6;
    --muted: #978c79;
    --correct: #2f9e6e;
    --correct-dim: #24805a;
    --correct-soft: rgba(47, 158, 110, 0.16);
    --present: #c9922f;
    --present-dim: #a87725;
    --present-soft: rgba(201, 146, 47, 0.16);
    --danger: #c0564a;
    --font-display: "Cinzel", Georgia, serif;
    --font-body: "Archivo", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    padding-inline: 16px;
  }
  .screen {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-block: 28px;
    gap: 20px;
  }
  .header {
    width: 100%;
    max-width: 720px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .timer { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--paper); opacity: 0.85; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tiles { display: flex; align-items: center; gap: 4px; }
  .tile {
    width: 24px; height: 24px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 11px;
    color: var(--ink);
  }
  .tile.a { background: var(--correct); }
  .tile.b { background: var(--present); }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
  .streak { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--present); font-family: var(--font-mono); }
  .modes { display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  .mode-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 7px; border: none; background: none;
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s;
  }
  .mode-btn.active { background: var(--correct); color: var(--paper); }
  .mode-btn:not(.active):hover { color: var(--paper); }
  .lock-card {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 14px; padding: 26px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 14px; margin-top: 12px;
  }
  .lock-badge {
    width: 48px; height: 48px; border-radius: 999px; background: var(--present-soft);
    border: 1px solid var(--present-dim); display: flex; align-items: center; justify-content: center;
    color: var(--present);
  }
  .lock-card h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
  .lock-card p { font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }
  .unlock-btn {
    width: 100%; padding: 11px 16px; border-radius: 8px; border: none;
    background: var(--correct); color: var(--paper); font-weight: 600; font-size: 14px;
    cursor: pointer; transition: background-color .15s; font-family: var(--font-body);
  }
  .unlock-btn:hover { background: var(--correct-dim); }
  .theme-label { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0; }
  .complete-msg { color: var(--correct); font-size: 14px; font-weight: 500; margin: 4px 0 0; }
  .board-row {
    width: 100%; max-width: 720px; display: flex; align-items: flex-start; justify-content: center;
    gap: 20px; flex-wrap: wrap;
  }
  .grid {
    display: inline-grid; gap: 3px; padding: 10px; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 14px; touch-action: none; user-select: none;
  }
  .cell {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 600; font-size: 14px; border-radius: 4px;
    background: var(--ink); color: rgba(243,239,230,0.8); cursor: pointer; transition: background-color .1s, color .1s;
  }
  .cell:hover { background: var(--surface-high); }
  .cell.selected { background: var(--present); color: var(--ink); }
  .cell.found { background: var(--correct); color: var(--paper); }
  .word-rail { width: 100%; max-width: 180px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
  .word-chip {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 7px;
    font-family: var(--font-mono); font-size: 13px; background: var(--ink); color: rgba(243,239,230,0.8);
  }
  .word-chip.found { background: var(--correct-soft); color: var(--correct); text-decoration: line-through; text-decoration-thickness: 2px; }
  .check-icon { flex-shrink: 0; visibility: hidden; }
  .word-chip.found .check-icon { visibility: visible; }
  .new-puzzle-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 14px; font-family: var(--font-body); transition: color .15s;
  }
  .new-puzzle-btn:hover { color: var(--paper); }
  .leaderboard {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 12px; padding: 14px 16px;
  }
  .leaderboard-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--present); margin-bottom: 8px; }
  .leaderboard-empty { font-size: 13px; color: var(--muted); margin: 0; }
  .leaderboard-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .leaderboard-row {
    display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono);
    font-size: 13px; padding: 5px 8px; border-radius: 6px; color: rgba(243,239,230,0.8); font-variant-numeric: tabular-nums;
  }
  .leaderboard-row.you { background: var(--correct-soft); color: var(--correct); }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(11,10,8,0.8); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 10;
  }
  .modal {
    width: 100%; max-width: 320px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .modal h2 { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0; }
  .modal p { font-size: 14px; color: var(--muted); margin: 0; }
  .modal input {
    width: 100%; padding: 9px 12px; border-radius: 8px; background: var(--ink); border: 1px solid var(--rule);
    color: var(--paper); font-family: var(--font-mono); font-size: 14px;
  }
  .modal input:focus { outline: none; border-color: var(--correct); }
  .modal-actions { display: flex; gap: 8px; }
  .modal-skip, .modal-save {
    flex: 1; padding: 9px 12px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: var(--font-body); transition: opacity .15s, background-color .15s;
  }
  .modal-skip { background: none; color: var(--muted); }
  .modal-skip:hover { color: var(--paper); }
  .modal-save { background: var(--correct); color: var(--paper); }
  .modal-save:hover { background: var(--correct-dim); }
  .modal-save:disabled { opacity: 0.4; cursor: default; }
  @media (max-width: 460px) {
    .board-row { flex-direction: column; align-items: center; }
    .word-rail { max-width: 320px; grid-template-columns: repeat(2, minmax(0,1fr)); }
    .cell { width: 26px; height: 26px; font-size: 12px; }
  }

<script type="text/babel" data-presets="react">
const { useState, useCallback, useRef } = React;

/* ---------------- rng.ts ---------------- */
function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr) {
  return mulberry32(hashSeed(seedStr)());
}

/* ---------------- wordsearch.ts ---------------- */
const STRAIGHT_DIRECTIONS = [[0,1],[1,0],[0,-1],[-1,0]];
const DIAGONAL_DIRECTIONS = [[1,1],[1,-1],[-1,-1],[-1,1]];
const DIFFICULTY_TUNING = { easy: { diagonalWeight: 1 }, classic: { diagonalWeight: 2.5 }, hard: { diagonalWeight: 4 } };
function directionBag(rng, tuning) {
  const bag = [...STRAIGHT_DIRECTIONS];
  const diagonalCopies = Math.max(1, Math.round(tuning.diagonalWeight));
  for (let i = 0; i < diagonalCopies; i++) bag.push(...DIAGONAL_DIRECTIONS);
  return bag.sort(() => rng() - 0.5);
}
const LETTER_WEIGHTS = [["e",12.7],["t",9.1],["a",8.2],["o",7.5],["i",7.0],["n",6.7],["s",6.3],["h",6.1],["r",6.0],["d",4.3],["l",4.0],["c",2.8],["u",2.8],["m",2.4],["w",2.4],["f",2.2],["g",2.0],["y",2.0],["p",1.9],["b",1.5],["v",1.0],["k",0.8],["j",0.15],["x",0.15],["q",0.1],["z",0.07]];
const LETTER_TABLE = LETTER_WEIGHTS.flatMap(([ch, w]) => Array(Math.round(w * 4)).fill(ch));
function randomLetter(rng) { return LETTER_TABLE[Math.floor(rng() * LETTER_TABLE.length)].toUpperCase(); }
function fits(grid, size, word, row, col, dRow, dCol) {
  for (let i = 0; i < word.length; i++) {
    const r = row + dRow * i, c = col + dCol * i;
    if (r < 0 || r >= size || c < 0 || c >= size) return false;
    const existing = grid[r][c];
    if (existing !== null && existing !== word[i]) return false;
  }
  return true;
}
function place(grid, word, row, col, dRow, dCol) {
  for (let i = 0; i < word.length; i++) grid[row + dRow * i][col + dCol * i] = word[i];
}
function generatePuzzle(words, size, seed, difficulty = "classic") {
  const rng = makeRng(seed);
  const tuning = DIFFICULTY_TUNING[difficulty];
  const upper = words.map((w) => w.toUpperCase().replace(/[^A-Z]/g, ""));
  const ordered = [...upper].sort((a, b) => b.length - a.length);
  const grid = Array.from({ length: size }, () => Array(size).fill(null));
  const placed = [];
  for (const word of ordered) {
    if (word.length > size) continue;
    const dirOrder = directionBag(rng, tuning);
    let done = false;
    for (let attempt = 0; attempt < 200 && !done; attempt++) {
      const dir = dirOrder[attempt % dirOrder.length];
      const row = Math.floor(rng() * size), col = Math.floor(rng() * size);
      if (fits(grid, size, word, row, col, dir[0], dir[1])) {
        place(grid, word, row, col, dir[0], dir[1]);
        placed.push({ word, row, col, dRow: dir[0], dCol: dir[1] });
        done = true;
      }
    }
  }
  const filled = grid.map((row) => row.map((cell) => cell ?? randomLetter(rng)));
  return { size, grid: filled, words: placed };
}
function sizeForWords(words, difficulty = "classic") {
  const density = { easy: 2.2, classic: 1.8, hard: 1.5 };
  const longest = Math.max(...words.map((w) => w.length));
  const base = Math.ceil(Math.sqrt(words.reduce((sum, w) => sum + w.length, 0) * density[difficulty]));
  return Math.max(longest + 1, base, 10);
}
function matchSelection(selection, puzzle) {
  if (selection.length < 2) return null;
  const a = selection[0], b = selection[1];
  const dRow = Math.sign(b.row - a.row), dCol = Math.sign(b.col - a.col);
  for (let i = 1; i < selection.length; i++) {
    const expected = { row: a.row + dRow * i, col: a.col + dCol * i };
    if (selection[i].row !== expected.row || selection[i].col !== expected.col) return null;
  }
  for (const pw of puzzle.words) {
    const endRow = pw.row + pw.dRow * (pw.word.length - 1);
    const endCol = pw.col + pw.dCol * (pw.word.length - 1);
    const forward = pw.row === a.row && pw.col === a.col && pw.dRow === dRow && pw.dCol === dCol && selection.length === pw.word.length;
    const backward = endRow === a.row && endCol === a.col && pw.dRow === -dRow && pw.dCol === -dCol && selection.length === pw.word.length;
    if (forward || backward) return pw;
  }
  return null;
}

/* ---------------- data/wordbank.ts ---------------- */
const THEMES = [
  { id: "animals", label: "Animals", words: ["TIGER","ZEBRA","OTTER","FALCON","RABBIT","PANDA","DOLPHIN","CAMEL","MOOSE","HERON","GECKO","BISON","LLAMA","WEASEL","PELICAN","COYOTE","LYNX","SPARROW","BEAVER","MANTIS"] },
  { id: "kitchen", label: "Kitchen", words: ["WHISK","KETTLE","LADLE","SKILLET","COLANDER","SPATULA","TONGS","GRATER","APRON","SIEVE","BLENDER","PLATTER","SAUCEPAN","TRIVET","CLEAVER","FUNNEL","PANTRY","OVEN","TOASTER","GRIDDLE"] },
  { id: "weather", label: "Weather", words: ["THUNDER","DRIZZLE","BREEZE","BLIZZARD","HUMID","FROST","MONSOON","CYCLONE","SLEET","HAZE","RAINBOW","OVERCAST","GALE","MIST","HAIL","SQUALL","SUNSHINE","CLOUDY","TORNADO","DEWPOINT"] },
  { id: "space", label: "Space", words: ["COMET","NEBULA","ORBIT","GALAXY","METEOR","ASTEROID","ROCKET","LUNAR","SATELLITE","ECLIPSE","COSMOS","PULSAR","GRAVITY","TELESCOPE","QUASAR","CRATER","NOVA","CAPSULE","ASTRONAUT","HORIZON"] },
  { id: "music", label: "Music", words: ["RHYTHM","MELODY","TEMPO","CHORUS","BALLAD","CADENCE","VIOLIN","TRUMPET","HARMONY","CLARINET","SONATA","ENCORE","OCTAVE","BARITONE","PIANO","DRUMKIT","LYRICS","MAESTRO","TUNING","ACOUSTIC"] },
  { id: "garden", label: "Garden", words: ["TROWEL","COMPOST","BLOSSOM","TRELLIS","SPROUT","MULCH","ORCHID","HEDGE","WATERING","PERGOLA","SHOVEL","PETUNIA","NURSERY","FERTILE","SEEDLING","BLOOM","GREENHOUSE","PRUNING","LAVENDER","TERRACE"] },
];
function themeById(id) { return THEMES.find((t) => t.id === id); }

/* ---------------- lib/puzzleOfTheDay.ts ---------------- */
const WORDS_PER_PUZZLE = 12;
const DAILY_DIFFICULTY = "hard"; // the leaderboard-ranked puzzle is the same for everyone, and hard
function todayUtc() { return new Date().toISOString().slice(0, 10); }
function pickWords(allWords, count, rng) {
  const pool = [...allWords];
  const chosen = [];
  while (chosen.length < count && pool.length) {
    const i = Math.floor(rng() * pool.length);
    chosen.push(pool.splice(i, 1)[0]);
  }
  return chosen;
}
function getDailyPuzzle(date = todayUtc()) {
  const rng = makeRng(`daily:${date}`);
  const theme = THEMES[Math.floor(rng() * THEMES.length)];
  const words = pickWords(theme.words, WORDS_PER_PUZZLE, rng);
  const size = sizeForWords(words, DAILY_DIFFICULTY);
  const puzzle = generatePuzzle(words, size, `daily:${date}`, DAILY_DIFFICULTY);
  return { date, themeLabel: theme.label, puzzle };
}
function getRandomPuzzle(themeId, difficulty = "hard") {
  const theme = themeId ? themeById(themeId) : THEMES[Math.floor(Math.random() * THEMES.length)];
  const seed = `random:${Date.now()}:${Math.random()}`;
  const rng = makeRng(seed);
  const words = pickWords(theme.words, WORDS_PER_PUZZLE, rng);
  const size = sizeForWords(words, difficulty);
  const puzzle = generatePuzzle(words, size, seed, difficulty);
  return { date: seed, themeLabel: theme.label, puzzle };
}

/* ---------------- lib/localSave.ts ---------------- */
const SAVE_KEY = "wordezySearch.save.v1";
const localSave = {
  get() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return { streak: 0, lastWinDate: null, unlockedUnlimited: false, displayName: null, ...JSON.parse(raw) };
    } catch (e) {}
    return { streak: 0, lastWinDate: null, unlockedUnlimited: false, displayName: null };
  },
  set(save) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
    return save;
  },
  recordDailyWin(date) {
    const save = this.get();
    if (save.lastWinDate === date) return save;
    const y = new Date(date + "T00:00:00Z");
    y.setUTCDate(y.getUTCDate() - 1);
    const yesterday = y.toISOString().slice(0, 10);
    const streak = save.lastWinDate === yesterday ? save.streak + 1 : 1;
    return this.set({ ...save, streak, lastWinDate: date });
  },
  // Stub — never call this from anywhere except a confirmed,
  // server-verified purchase once that exists.
  setUnlocked(value) {
    const save = this.get();
    return this.set({ ...save, unlockedUnlimited: value });
  },
  setDisplayName(name) {
    const save = this.get();
    return this.set({ ...save, displayName: name.trim().slice(0, 20) || null });
  },
};

/* ---------------- hooks/useTimer.ts ---------------- */
function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}:${seconds.toString().padStart(2, "0")}`;
}
function useTimer(resetKey, running) {
  const [elapsedMs, setElapsedMs] = useState(0);
  const startRef = useRef(Date.now());
  React.useEffect(() => { startRef.current = Date.now(); setElapsedMs(0); }, [resetKey]);
  React.useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setElapsedMs(Date.now() - startRef.current), 250);
    return () => clearInterval(id);
  }, [running, resetKey]);
  return elapsedMs;
}

/* ---------------- components/Leaderboard.tsx ----------------
   Backed by this artifact's own shared `db` — a live, cross-viewer demo of
   the daily leaderboard. The real site (built from the Vite/React source)
   talks to a Supabase table instead; same shape, different transport. */
function Leaderboard({ date, refreshKey }) {
  const [entries, setEntries] = useState(null);
  const [selfId, setSelfId] = useState(null);
  const [available, setAvailable] = useState(true);

  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!window.claude?.use) { setAvailable(false); return; }
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { setAvailable(false); return; }
      const id = await user.id();
      if (cancelled) return;
      setSelfId(id);
      try {
        const snap = await db.collection("scores").where("date", "==", date).orderBy("timeMs", "asc").limit(10).get();
        if (!cancelled) setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      } catch (e) {
        if (!cancelled) setAvailable(false);
      }
    })();
    return () => { cancelled = true; };
  }, [date, refreshKey]);

  if (!available || entries === null) return null;

  return (
    <div className="leaderboard">
      <div className="leaderboard-title"><TrophyIcon size={16} /> Today's fastest</div>
      {entries.length === 0 ? (
        <p className="leaderboard-empty">No times yet today — be the first.</p>
      ) : (
        <ol className="leaderboard-list">
          {entries.map((e, i) => (
            <li key={e.id} className={`leaderboard-row ${e.id === selfId ? "you" : ""}`}>
              <span>{i + 1}. {e.displayName}{e.id === selfId ? " (you)" : ""}</span>
              <span>{formatTime(e.timeMs)}</span>
            </li>
          ))}
        </ol>
      )}
    </div>
  );
}

async function submitDailyScore(date, displayName, timeMs) {
  if (!window.claude?.use) return false;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return false;
  const id = await user.id();
  if (!id) return false;
  await db.doc("scores/" + id).set({ displayName, date, timeMs, updatedAt: Date.now() });
  return true;
}

/* ---------------- components/Grid.tsx ---------------- */
function pathBetween(from, to) {
  const dRow = Math.sign(to.row - from.row), dCol = Math.sign(to.col - from.col);
  const steps = Math.max(Math.abs(to.row - from.row), Math.abs(to.col - from.col));
  const path = [];
  for (let i = 0; i <= steps; i++) path.push({ row: from.row + dRow * i, col: from.col + dCol * i });
  return path;
}
function Grid({ puzzle, foundWords, onWordFound }) {
  const [anchor, setAnchor] = useState(null);
  const [selection, setSelection] = useState([]);
  const dragging = useRef(false);

  const foundCells = new Set();
  for (const pw of puzzle.words) {
    if (!foundWords.has(pw.word)) continue;
    for (let i = 0; i < pw.word.length; i++) foundCells.add(`${pw.row + pw.dRow * i},${pw.col + pw.dCol * i}`);
  }
  const selectedCells = new Set(selection.map((c) => `${c.row},${c.col}`));

  const cellFromPoint = useCallback((clientX, clientY) => {
    const el = document.elementFromPoint(clientX, clientY);
    const row = el?.dataset?.row, col = el?.dataset?.col;
    if (row == null || col == null) return null;
    return { row: Number(row), col: Number(col) };
  }, []);

  const finishSelection = useCallback((path) => {
    const match = matchSelection(path, puzzle);
    if (match && !foundWords.has(match.word)) onWordFound(match.word);
    setAnchor(null); setSelection([]); dragging.current = false;
  }, [puzzle, foundWords, onWordFound]);

  const handleStart = (cell) => { dragging.current = true; setAnchor(cell); setSelection([cell]); };
  const handleMove = (clientX, clientY) => {
    if (!dragging.current || !anchor) return;
    const cell = cellFromPoint(clientX, clientY);
    if (!cell) return;
    setSelection(pathBetween(anchor, cell));
  };
  const handleEnd = () => { if (dragging.current) finishSelection(selection); };

  return (
    <div
      className="grid"
      style={{ gridTemplateColumns: `repeat(${puzzle.size}, 1fr)` }}
      onMouseUp={handleEnd}
      onMouseLeave={handleEnd}
      onTouchEnd={handleEnd}
      onMouseMove={(e) => handleMove(e.clientX, e.clientY)}
      onTouchMove={(e) => { const t = e.touches[0]; if (t) handleMove(t.clientX, t.clientY); }}
    >
      {puzzle.grid.map((row, r) => row.map((letter, c) => {
        const key = `${r},${c}`;
        const isFound = foundCells.has(key), isSelected = selectedCells.has(key);
        return (
          <div
            key={key}
            data-row={r}
            data-col={c}
            onMouseDown={() => handleStart({ row: r, col: c })}
            onTouchStart={() => handleStart({ row: r, col: c })}
            className={`cell ${isFound ? "found" : isSelected ? "selected" : ""}`}
          >
            {letter}
          </div>
        );
      }))}
    </div>
  );
}

/* ---------------- components/WordList.tsx ---------------- */
function WordList({ words, found }) {
  return (
    <div className="word-rail">
      {words.map((w) => {
        const isFound = found.has(w.word);
        return (
          <div key={w.word} className={`word-chip ${isFound ? "found" : ""}`}>
            <span className="check-icon"><CheckIcon size={14} /></span>
            <span>{w.word}</span>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- pages/GamePage.tsx ---------------- */
function WordmarkTiles() {
  return (
    <div className="tiles">
      {["W","O","R","D"].map((letter, i) => (
        <span key={i} className={`tile ${i % 2 === 0 ? "a" : "b"}`}>{letter}</span>
      ))}
    </div>
  );
}
function GamePage() {
  const [mode, setMode] = useState("daily");
  const [save, setSave] = useState(() => localSave.get());
  const [daily] = useState(() => getDailyPuzzle());
  const [unlimited, setUnlimited] = useState(() => getRandomPuzzle());
  const [foundDaily, setFoundDaily] = useState(() => new Set());
  const [foundUnlimited, setFoundUnlimited] = useState(() => new Set());
  const [namePrompt, setNamePrompt] = useState({ open: false, timeMs: 0, draft: "" });
  const [leaderboardKey, setLeaderboardKey] = useState(0);
  const [scoreStatus, setScoreStatus] = useState("idle");

  const active = mode === "daily" ? daily : unlimited;
  const found = mode === "daily" ? foundDaily : foundUnlimited;
  const setFound = mode === "daily" ? setFoundDaily : setFoundUnlimited;
  const isComplete = found.size === active.puzzle.words.length && active.puzzle.words.length > 0;
  const timerMs = useTimer(`${mode}:${active.date}`, !isComplete);

  const trySubmit = async (timeMs, displayName) => {
    setScoreStatus("saving");
    const ok = await submitDailyScore(daily.date, displayName, timeMs).catch(() => false);
    if (ok) { setScoreStatus("saved"); setLeaderboardKey((k) => k + 1); }
    else setScoreStatus("failed");
  };

  const handleWordFound = (word) => {
    const next = new Set(found); next.add(word); setFound(next);
    if (mode === "daily" && next.size === daily.puzzle.words.length) {
      setSave(localSave.recordDailyWin(todayUtc()));
      if (save.displayName) trySubmit(timerMs, save.displayName);
      else setNamePrompt({ open: true, timeMs, draft: "" });
    }
  };

  const confirmName = () => {
    const name = namePrompt.draft.trim().slice(0, 20);
    if (!name) return;
    setSave(localSave.setDisplayName(name));
    setNamePrompt({ open: false, timeMs: 0, draft: "" });
    trySubmit(namePrompt.timeMs, name);
  };

  const newUnlimitedPuzzle = () => { setUnlimited(getRandomPuzzle()); setFoundUnlimited(new Set()); };
  const handleUnlock = () => alert("Payments aren't set up yet — Classic Unlimited will unlock for $2 once that's wired in.");
  const locked = mode === "unlimited" && !save.unlockedUnlimited;

  return (
    <div className="screen">
      <header className="header">
        <div className="brand"><WordmarkTiles /><h1>Wordezy Search</h1></div>
        <div className="header-right">
          {!locked && <div className="timer"><TimerIcon size={16} />{formatTime(timerMs)}</div>}
          {save.streak > 0 && <div className="streak"><FlameIcon size={16} />{save.streak}</div>}
        </div>
      </header>

      <div className="modes">
        <button type="button" onClick={() => setMode("daily")} className={`mode-btn ${mode === "daily" ? "active" : ""}`}>Daily</button>
        <button type="button" onClick={() => setMode("unlimited")} className={`mode-btn ${mode === "unlimited" ? "active" : ""}`}>
          {!save.unlockedUnlimited && <LockIcon size={14} />}
          Classic Unlimited
        </button>
      </div>

      {locked ? (
        <div className="lock-card">
          <div className="lock-badge"><SparklesIcon size={22} /></div>
          <div>
            <h2>Classic Unlimited</h2>
            <p>Unlock endless puzzles across every theme — no daily limit, play as many as you want, whenever you want.</p>
          </div>
          <button type="button" onClick={handleUnlock} className="unlock-btn">Unlock for $2</button>
        </div>
      ) : (
        <>
          <div style={{ textAlign: "center" }}>
            <p className="theme-label">{active.themeLabel}</p>
            {isComplete && (
              <p className="complete-msg">
                Solved in {formatTime(timerMs)}
                {mode === "daily" && scoreStatus === "failed" ? " — saved locally only" : ""}
              </p>
            )}
          </div>
          <div className="board-row">
            <Grid puzzle={active.puzzle} foundWords={found} onWordFound={handleWordFound} />
            <WordList words={active.puzzle.words} found={found} />
          </div>
          {mode === "unlimited" && (
            <button type="button" onClick={newUnlimitedPuzzle} className="new-puzzle-btn">
              <RefreshIcon size={14} /> New puzzle
            </button>
          )}
          {mode === "daily" && <Leaderboard date={daily.date} refreshKey={leaderboardKey} />}
        </>
      )}

      {namePrompt.open && (
        <div className="modal-backdrop">
          <div className="modal">
            <h2>Solved in {formatTime(namePrompt.timeMs)}!</h2>
            <p>Pick a name for today's leaderboard.</p>
            <input
              type="text"
              autoFocus
              maxLength={20}
              value={namePrompt.draft}
              onChange={(e) => setNamePrompt((p) => ({ ...p, draft: e.target.value }))}
              onKeyDown={(e) => e.key === "Enter" && confirmName()}
              placeholder="Your name"
            />
            <div className="modal-actions">
              <button type="button" className="modal-skip" onClick={() => setNamePrompt({ open: false, timeMs: 0, draft: "" })}>Skip</button>
              <button type="button" className="modal-save" disabled={!namePrompt.draft.trim()} onClick={confirmName}>Save score</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GamePage />);
</script>
