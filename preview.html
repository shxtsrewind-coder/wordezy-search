<style>

<script type="text/babel" data-presets="react">

/* ---------------- rng.ts ---------------- */
function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr) {
  return mulberry32(hashSeed(seedStr)());
}

/* ---------------- wordsearch.ts ---------------- */
const STRAIGHT_DIRECTIONS = [[0,1],[1,0],[0,-1],[-1,0]];
const DIAGONAL_DIRECTIONS = [[1,1],[1,-1],[-1,-1],[-1,1]];
const DIFFICULTY_TUNING = { easy: { diagonalWeight: 1 }, classic: { diagonalWeight: 2.5 }, hard: { diagonalWeight: 4 } };
function directionBag(rng, tuning) {
  const bag = [...STRAIGHT_DIRECTIONS];
  const diagonalCopies = Math.max(1, Math.round(tuning.diagonalWeight));
  for (let i = 0; i < diagonalCopies; i++) bag.push(...DIAGONAL_DIRECTIONS);
  return bag.sort(() => rng() - 0.5);
}
const LETTER_WEIGHTS = [["e",12.7],["t",9.1],["a",8.2],["o",7.5],["i",7.0],["n",6.7],["s",6.3],["h",6.1],["r",6.0],["d",4.3],["l",4.0],["c",2.8],["u",2.8],["m",2.4],["w",2.4],["f",2.2],["g",2.0],["y",2.0],["p",1.9],["b",1.5],["v",1.0],["k",0.8],["j",0.15],["x",0.15],["q",0.1],["z",0.07]];
const LETTER_TABLE = LETTER_WEIGHTS.flatMap(([ch, w]) => Array(Math.round(w * 4)).fill(ch));
function randomLetter(rng) { return LETTER_TABLE[Math.floor(rng() * LETTER_TABLE.length)].toUpperCase(); }
function fits(grid, size, word, row, col, dRow, dCol) {
  for (let i = 0; i < word.length; i++) {
    const r = row + dRow * i, c = col + dCol * i;
    if (r < 0 || r >= size || c < 0 || c >= size) return false;
    const existing = grid[r][c];
    if (existing !== null && existing !== word[i]) return false;
  }
  return true;
}
function place(grid, word, row, col, dRow, dCol) {
  for (let i = 0; i < word.length; i++) grid[row + dRow * i][col + dCol * i] = word[i];
}
function generatePuzzle(words, size, seed, difficulty = "classic") {
  const rng = makeRng(seed);
  const tuning = DIFFICULTY_TUNING[difficulty];
  const upper = words.map((w) => w.toUpperCase().replace(/[^A-Z]/g, ""));
  const ordered = [...upper].sort((a, b) => b.length - a.length);
  const grid = Array.from({ length: size }, () => Array(size).fill(null));
  const placed = [];
  for (const word of ordered) {
    if (word.length > size) continue;
    const dirOrder = directionBag(rng, tuning);
    let done = false;
    for (let attempt = 0; attempt < 200 && !done; attempt++) {
      const dir = dirOrder[attempt % dirOrder.length];
      const row = Math.floor(rng() * size), col = Math.floor(rng() * size);
      if (fits(grid, size, word, row, col, dir[0], dir[1])) {
        place(grid, word, row, col, dir[0], dir[1]);
        placed.push({ word, row, col, dRow: dir[0], dCol: dir[1] });
        done = true;
      }
    }
  }
  const filled = grid.map((row) => row.map((cell) => cell ?? randomLetter(rng)));
  return { size, grid: filled, words: placed };
}
function sizeForWords(words, difficulty = "classic") {
  const density = { easy: 2.2, classic: 1.8, hard: 1.5 };
  const longest = Math.max(...words.map((w) => w.length));
  const base = Math.ceil(Math.sqrt(words.reduce((sum, w) => sum + w.length, 0) * density[difficulty]));
  return Math.max(longest + 1, base, 10);
}
function matchSelection(selection, puzzle) {
  if (selection.length < 2) return null;
  const a = selection[0], b = selection[1];
  const dRow = Math.sign(b.row - a.row), dCol = Math.sign(b.col - a.col);
  for (let i = 1; i < selection.length; i++) {
    const expected = { row: a.row + dRow * i, col: a.col + dCol * i };
    if (selection[i].row !== expected.row || selection[i].col !== expected.col) return null;
  }
  for (const pw of puzzle.words) {
    const endRow = pw.row + pw.dRow * (pw.word.length - 1);
    const endCol = pw.col + pw.dCol * (pw.word.length - 1);
    const forward = pw.row === a.row && pw.col === a.col && pw.dRow === dRow && pw.dCol === dCol && selection.length === pw.word.length;
    const backward = endRow === a.row && endCol === a.col && pw.dRow === -dRow && pw.dCol === -dCol && selection.length === pw.word.length;
    if (forward || backward) return pw;
  }
  return null;
}

/* ---------------- lib/puzzleOfTheDay.ts ---------------- */
const WORDS_PER_PUZZLE = 10;
const GRID_SIZE_FLOOR = 11; // keeps the board the same size as the old 12-word puzzle
const DIFFICULTIES = ["easy", "classic", "hard"];
// Daily is always the hardest setting — one shared leaderboard, no picking
// an easier board to climb it. Difficulty choice lives in Classic Unlimited.
const DAILY_DIFFICULTY = "hard";
function todayUtc() { return new Date().toISOString().slice(0, 10); }
function pickWords(allWords, count, rng) {
  const pool = [...allWords];
  const chosen = [];
  while (chosen.length < count && pool.length) {
    const i = Math.floor(rng() * pool.length);
    chosen.push(pool.splice(i, 1)[0]);
  }
  return chosen;
}
// Theme + word list come from the date alone. Always generated on Hard,
// since the daily leaderboard is one shared ranking, not one per difficulty.
function getDailyPuzzle(date = todayUtc()) {
  const difficulty = DAILY_DIFFICULTY;
  const rng = makeRng(`daily:${date}`);
  const theme = THEMES[Math.floor(rng() * THEMES.length)];
  const words = pickWords(theme.words, WORDS_PER_PUZZLE, rng);
  const size = Math.max(sizeForWords(words, difficulty), GRID_SIZE_FLOOR);
  const puzzle = generatePuzzle(words, size, `daily:${date}:${difficulty}`, difficulty);
  return { date, difficulty, themeId: theme.id, themeLabel: theme.label, puzzle };
}
function getRandomPuzzle(themeId, difficulty = "hard") {
  const theme = themeId ? themeById(themeId) : THEMES[Math.floor(Math.random() * THEMES.length)];
  const seed = `random:${Date.now()}:${Math.random()}`;
  const rng = makeRng(seed);
  const words = pickWords(theme.words, WORDS_PER_PUZZLE, rng);
  const size = Math.max(sizeForWords(words, difficulty), GRID_SIZE_FLOOR);
  const puzzle = generatePuzzle(words, size, seed, difficulty);
  return { date: seed, difficulty, themeId: theme.id, themeLabel: theme.label, puzzle };
}

/* ---------------- lib/localSave.ts ---------------- */
const SAVE_KEY = "wordezySearch.save.v1";
const SAVE_DEFAULTS = {
  streak: 0,
  lastWinDate: null,
  unlockedUnlimited: false,
  displayName: null,
  lastUnlimitedDifficulty: "hard",
  totalDailyWins: 0,
  bestDailyTimeMs: null,
  maxStreak: 0,
  themesCleared: [],
  unlockedAchievements: [],
};
const localSave = {
  get() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return { ...SAVE_DEFAULTS, ...JSON.parse(raw) };
    } catch (e) {}
    return { ...SAVE_DEFAULTS };
  },
  set(save) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
    return save;
  },
  // Streak/total-wins count once per calendar day.
  recordDailyWin(date, themeId, timeMs) {
    const save = this.get();
    save.bestDailyTimeMs = save.bestDailyTimeMs === null ? timeMs : Math.min(save.bestDailyTimeMs, timeMs);
    if (!save.themesCleared.includes(themeId)) save.themesCleared = [...save.themesCleared, themeId];

    if (save.lastWinDate !== date) {
      const y = new Date(date + "T00:00:00Z");
      y.setUTCDate(y.getUTCDate() - 1);
      const yesterday = y.toISOString().slice(0, 10);
      save.streak = save.lastWinDate === yesterday ? save.streak + 1 : 1;
      save.lastWinDate = date;
      save.maxStreak = Math.max(save.maxStreak, save.streak);
      save.totalDailyWins += 1;
    }
    return this.set(save);
  },
  setLastUnlimitedDifficulty(difficulty) {
    const save = this.get();
    return this.set({ ...save, lastUnlimitedDifficulty: difficulty });
  },
  setUnlockedAchievements(ids) {
    const save = this.get();
    return this.set({ ...save, unlockedAchievements: ids });
  },
  // Stub — never call this from anywhere except a confirmed,
  // server-verified purchase once that exists.
  setUnlocked(value) {
    const save = this.get();
    return this.set({ ...save, unlockedUnlimited: value });
  },
  setDisplayName(name) {
    const save = this.get();
    return this.set({ ...save, displayName: name.trim().slice(0, 20) || null });
  },
};

/* ---------------- hooks/useTimer.ts ---------------- */
function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}:${seconds.toString().padStart(2, "0")}`;
}
function useTimer(resetKey, running) {
  const [elapsedMs, setElapsedMs] = useState(0);
  const startRef = useRef(Date.now());
  React.useEffect(() => { startRef.current = Date.now(); setElapsedMs(0); }, [resetKey]);
  React.useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setElapsedMs(Date.now() - startRef.current), 250);
    return () => clearInterval(id);
  }, [running, resetKey]);
  return elapsedMs;
}

/* ---------------- components/Leaderboard.tsx ----------------
   Backed by this artifact's own shared `db` — a live, cross-viewer demo of
   the leaderboard. The real site (built from the Vite/React source) talks
   to a Supabase table instead; same shape, different transport. Each player
   has exactly one doc (scores/{self} — that's all this db's write rule
   allows), so "today" is tracked per-difficulty inside that one doc
   (timeMsByDifficulty) and reset whenever a new date rolls in. */
function Leaderboard({ date, difficulty, refreshKey }) {
  const [tab, setTab] = useState("today");
  const [todayEntries, setTodayEntries] = useState(null);
  const [allTimeEntries, setAllTimeEntries] = useState(null);
  const [selfId, setSelfId] = useState(null);
  const [available, setAvailable] = useState(true);

  React.useEffect(() => {
    let cancelled = false;
    setTodayEntries(null);
    (async () => {
      if (!window.claude?.use) { setAvailable(false); return; }
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { setAvailable(false); return; }
      const id = await user.id();
      if (cancelled) return;
      setSelfId(id);
      try {
        const snap = await db.collection("scores").where("date", "==", date).limit(100).get();
        const rows = snap.docs
          .map((d) => d.data())
          .filter((row) => row.timeMsByDifficulty && row.timeMsByDifficulty[difficulty] != null)
          .map((row) => ({ playerId: row.playerId, displayName: row.displayName, timeMs: row.timeMsByDifficulty[difficulty] }))
          .sort((a, b) => a.timeMs - b.timeMs)
          .slice(0, 10);
        if (!cancelled) setTodayEntries(rows);
      } catch (e) {
        if (!cancelled) setAvailable(false);
      }
    })();
    return () => { cancelled = true; };
  }, [date, difficulty, refreshKey]);

  React.useEffect(() => {
    if (tab !== "alltime" || allTimeEntries !== null || !available) return;
    let cancelled = false;
    (async () => {
      if (!window.claude?.use) return;
      const db = await window.claude.use("db");
      if (!db) return;
      try {
        // Each player has exactly one doc (scores/{self}), carrying their
        // cumulative totalWins/bestTimeMs alongside today's date/timeMs —
        // the all-time tab reads those cumulative fields directly rather
        // than aggregating per-day history (this demo keeps no such
        // history; the real Supabase-backed site does).
        const snap = await db.collection("scores").orderBy("totalWins", "desc").limit(10).get();
        const ranked = snap.docs
          .map((d) => d.data())
          .filter((row) => (row.totalWins ?? 0) > 0)
          .sort((a, b) => b.totalWins - a.totalWins || a.bestTimeMs - b.bestTimeMs);
        if (!cancelled) setAllTimeEntries(ranked);
      } catch (e) {
        if (!cancelled) setAllTimeEntries([]);
      }
    })();
    return () => { cancelled = true; };
  }, [tab, available, allTimeEntries]);

  React.useEffect(() => { setAllTimeEntries(null); }, [refreshKey]);

  if (!available) return null;

  return (
    <div className="leaderboard">
      <div className="leaderboard-tabs">
        <button type="button" className={`leaderboard-tab ${tab === "today" ? "active" : ""}`} onClick={() => setTab("today")}>
          <TrophyIcon size={14} /> Today · {difficulty === "classic" ? "Normal" : difficulty[0].toUpperCase() + difficulty.slice(1)}
        </button>
        <button type="button" className={`leaderboard-tab ${tab === "alltime" ? "active" : ""}`} onClick={() => setTab("alltime")}>
          <CalendarIcon size={14} /> All-Time
        </button>
      </div>
      {tab === "today" ? (
        todayEntries === null ? null : todayEntries.length === 0 ? (
          <p className="leaderboard-empty">No times yet today — be the first.</p>
        ) : (
          <ol className="leaderboard-list">
            {todayEntries.map((e, i) => (
              <li key={e.playerId} className={`leaderboard-row ${e.playerId === selfId ? "you" : ""}`}>
                <span>{i + 1}. {e.displayName}{e.playerId === selfId ? " (you)" : ""}</span>
                <span>{formatTime(e.timeMs)}</span>
              </li>
            ))}
          </ol>
        )
      ) : allTimeEntries === null ? (
        <p className="leaderboard-empty">Loading…</p>
      ) : allTimeEntries.length === 0 ? (
        <p className="leaderboard-empty">No wins recorded yet — be the first.</p>
      ) : (
        <ol className="leaderboard-list">
          {allTimeEntries.map((e, i) => (
            <li key={e.playerId} className={`leaderboard-row ${e.playerId === selfId ? "you" : ""}`}>
              <span>{i + 1}. {e.displayName}{e.playerId === selfId ? " (you)" : ""}</span>
              <span>{e.wins} win{e.wins === 1 ? "" : "s"} · {formatTime(e.bestTimeMs)}</span>
            </li>
          ))}
        </ol>
      )}
    </div>
  );
}

async function submitDailyScore(date, difficulty, displayName, timeMs) {
  if (!window.claude?.use) return false;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return false;
  const id = await user.id();
  if (!id) return false;
  const ref = db.doc("scores/" + id);
  let prevWins = 0, prevBest = null, prevDate = null, prevTimes = {};
  try {
    const existing = await ref.get();
    const data = existing?.data?.();
    if (data) {
      prevWins = data.totalWins ?? 0;
      prevBest = data.bestTimeMs ?? null;
      prevDate = data.date ?? null;
      prevTimes = data.timeMsByDifficulty ?? {};
    }
  } catch (e) {}
  // Only bump the cumulative win count the first time a given date is
  // submitted — GamePage already guards against re-submitting mid-session,
  // but this also covers a second visit on the same day. A new date wipes
  // yesterday's per-difficulty times rather than letting a stale "today"
  // entry for a difficulty the player skipped linger under the new date.
  const isNewDate = prevDate !== date;
  const timeMsByDifficulty = isNewDate
    ? { [difficulty]: timeMs }
    : { ...prevTimes, [difficulty]: prevTimes[difficulty] == null ? timeMs : Math.min(prevTimes[difficulty], timeMs) };
  await ref.set({
    playerId: id,
    displayName,
    date,
    timeMsByDifficulty,
    totalWins: isNewDate ? prevWins + 1 : prevWins,
    bestTimeMs: prevBest === null ? timeMs : Math.min(prevBest, timeMs),
    updatedAt: Date.now(),
  });
  return true;
}

/* ---------------- components/Grid.tsx ---------------- */
function pathBetween(from, to) {
  const dRow = Math.sign(to.row - from.row), dCol = Math.sign(to.col - from.col);
  const steps = Math.max(Math.abs(to.row - from.row), Math.abs(to.col - from.col));
  const path = [];
  for (let i = 0; i <= steps; i++) path.push({ row: from.row + dRow * i, col: from.col + dCol * i });
  return path;
}
function Grid({ puzzle, foundWords, onWordFound, revealedCell = null }) {
  const [anchor, setAnchor] = useState(null);
  const [selection, setSelection] = useState([]);
  const dragging = useRef(false);

  const foundCells = new Set();
  for (const pw of puzzle.words) {
    if (!foundWords.has(pw.word)) continue;
    for (let i = 0; i < pw.word.length; i++) foundCells.add(`${pw.row + pw.dRow * i},${pw.col + pw.dCol * i}`);
  }
  const selectedCells = new Set(selection.map((c) => `${c.row},${c.col}`));

  const cellFromPoint = useCallback((clientX, clientY) => {
    const el = document.elementFromPoint(clientX, clientY);
    const row = el?.dataset?.row, col = el?.dataset?.col;
    if (row == null || col == null) return null;
    return { row: Number(row), col: Number(col) };
  }, []);

  const finishSelection = useCallback((path) => {
    const match = matchSelection(path, puzzle);
    if (match && !foundWords.has(match.word)) onWordFound(match.word);
    setAnchor(null); setSelection([]); dragging.current = false;
  }, [puzzle, foundWords, onWordFound]);

  const handleStart = (cell) => { dragging.current = true; setAnchor(cell); setSelection([cell]); };
  const handleMove = (clientX, clientY) => {
    if (!dragging.current || !anchor) return;
    const cell = cellFromPoint(clientX, clientY);
    if (!cell) return;
    setSelection(pathBetween(anchor, cell));
  };
  const handleEnd = () => { if (dragging.current) finishSelection(selection); };

  return (
    <div
      className="grid"
      style={{ gridTemplateColumns: `repeat(${puzzle.size}, 1fr)` }}
      onMouseUp={handleEnd}
      onMouseLeave={handleEnd}
      onTouchEnd={handleEnd}
      onMouseMove={(e) => handleMove(e.clientX, e.clientY)}
      onTouchMove={(e) => { const t = e.touches[0]; if (t) handleMove(t.clientX, t.clientY); }}
    >
      {puzzle.grid.map((row, r) => row.map((letter, c) => {
        const key = `${r},${c}`;
        const isFound = foundCells.has(key), isSelected = selectedCells.has(key);
        const isRevealed = revealedCell && revealedCell.row === r && revealedCell.col === c;
        return (
          <div
            key={key}
            data-row={r}
            data-col={c}
            onMouseDown={() => handleStart({ row: r, col: c })}
            onTouchStart={() => handleStart({ row: r, col: c })}
            className={`cell ${isFound ? "found" : isSelected ? "selected" : isRevealed ? "revealed" : ""}`}
          >
            {letter}
          </div>
        );
      }))}
    </div>
  );
}

/* ---------------- components/Confetti.tsx ---------------- */
const CONFETTI_COLORS = ["#2f9e6e", "#c9922f", "#f3efe6", "#a87725", "#24805a"];
function Confetti({ durationMs = 1800 }) {
  const canvasRef = useRef(null);
  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener("resize", resize);
    const particles = Array.from({ length: 80 }, () => ({
      x: window.innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: window.innerHeight * 0.3,
      vx: (Math.random() - 0.5) * 8,
      vy: -(Math.random() * 6 + 4),
      size: Math.random() * 6 + 4,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rotation: Math.random() * Math.PI,
      spin: (Math.random() - 0.5) * 0.3,
    }));
    let raf = 0, running = true;
    const gravity = 0.25;
    const tick = () => {
      if (!running) return;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const p of particles) {
        p.vy += gravity; p.x += p.vx; p.y += p.vy; p.rotation += p.spin;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const stop = setTimeout(() => { running = false; cancelAnimationFrame(raf); }, durationMs);
    return () => { running = false; clearTimeout(stop); cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, [durationMs]);
  return <canvas ref={canvasRef} aria-hidden="true" style={{ pointerEvents: "none", position: "fixed", inset: 0, zIndex: 50 }} />;
}

/* ---------------- components/AchievementToast.tsx ---------------- */
function AchievementToastStack({ achievements, onDone }) {
  const [index, setIndex] = useState(0);
  React.useEffect(() => {
    if (index >= achievements.length) { onDone(); return; }
    const t = setTimeout(() => setIndex((i) => i + 1), 3000);
    return () => clearTimeout(t);
  }, [index, achievements.length, onDone]);
  if (index >= achievements.length) return null;
  const a = achievements[index];
  const AchIcon = ICONS[a.icon];
  return (
    <div role="status" className="achievement-toast">
      <div className="achievement-toast-badge"><AchIcon size={18} /></div>
      <div>
        <p className="achievement-toast-label">Achievement unlocked</p>
        <p className="achievement-toast-title">{a.title}</p>
      </div>
    </div>
  );
}

/* ---------------- components/AchievementsModal.tsx ---------------- */
function AchievementsModal({ save, onClose }) {
  const unlocked = new Set(save.unlockedAchievements);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal achievements-modal" onClick={(e) => e.stopPropagation()}>
        <div className="achievements-header">
          <h2>Achievements</h2>
          <button type="button" className="icon-btn" onClick={onClose} aria-label="Close">×</button>
        </div>
        <p className="achievements-count">{unlocked.size} / {ACHIEVEMENTS.length} unlocked</p>
        <div className="achievements-list">
          {ACHIEVEMENTS.map((a) => {
            const isUnlocked = unlocked.has(a.id);
            const AchIcon = ICONS[a.icon];
            const progress = a.id === "explorer" ? `${save.themesCleared.length}/${THEMES.length} themes` : null;
            return (
              <div key={a.id} className={`achievement-row ${isUnlocked ? "unlocked" : ""}`}>
                <div className={`achievement-badge ${isUnlocked ? "unlocked" : ""}`}>
                  {isUnlocked ? <AchIcon size={16} /> : <LockIcon size={14} />}
                </div>
                <div>
                  <p className={`achievement-title ${isUnlocked ? "unlocked" : ""}`}>{a.title}</p>
                  <p className="achievement-desc">{a.description}</p>
                  {!isUnlocked && progress && <p className="achievement-progress">{progress}</p>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------- pages/GamePage.tsx ---------------- */
function WordmarkTiles() {
  return (
    <div className="tiles">
      {["W","O","R","D"].map((letter, i) => (
        <span key={i} className={`tile ${i % 2 === 0 ? "a" : "b"}`}>{letter}</span>
      ))}
    </div>
  );
}
const PLAY_CHOICE_KEY = "wordezySearch.playChoice";
const DIFFICULTY_LABELS = { easy: "Easy", classic: "Normal", hard: "Hard" };
const HINT_LETTER_LIMIT = 3;
const HINT_WORD_LIMIT = 1;

/* ---------------- components/ChoiceScreen.tsx ----------------
   Mandatory first-run screen (once per browser session): guest play, or a
   name so wins count on the leaderboard. The real site (Vite/React source)
   does this with full Supabase accounts (guest / sign up / log in); this
   CDN preview can't reach Supabase directly, so "join the leaderboard" here
   just picks a name backed by the artifact's own db capability — same
   guest-vs-named distinction, lighter mechanism. */
function ChoiceScreen({ onResolved }) {
  const [mode, setMode] = useState("main");
  const [draft, setDraft] = useState("");

  const confirm = () => {
    const name = draft.trim().slice(0, 20);
    if (!name) return;
    onResolved({ isGuest: false, displayName: name });
  };

  return (
    <div className="modal-backdrop">
      <div className="modal choice-modal">
        {mode === "main" ? (
          <>
            <h2>How do you want to play?</h2>
            <p>Choose how you'd like to experience Wordezy Search.</p>
            <div className="choice-options">
              <button type="button" className="choice-option" onClick={() => onResolved({ isGuest: true })}>
                <strong>Continue as guest</strong>
                <span>Play right away. Your progress stays on this device and won't appear on the leaderboard.</span>
              </button>
              <button type="button" className="choice-option highlight" onClick={() => setMode("name")}>
                <strong>Join the leaderboard</strong>
                <span>Pick a name to compete on today's leaderboard.</span>
              </button>
            </div>
          </>
        ) : (
          <>
            <h2>Pick a name</h2>
            <p>This is how you'll appear on the daily leaderboard.</p>
            <input
              type="text"
              autoFocus
              maxLength={20}
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && confirm()}
              placeholder="Your name"
            />
            <div className="modal-actions">
              <button type="button" className="modal-skip" onClick={() => setMode("main")}>Back</button>
              <button type="button" className="modal-save" disabled={!draft.trim()} onClick={confirm}>Save</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function GamePage() {
  const [phase, setPhase] = useState(() =>
    typeof sessionStorage !== "undefined" && sessionStorage.getItem(PLAY_CHOICE_KEY) === "true" ? "ready" : "choice"
  );
  const [mode, setMode] = useState("daily");
  const [save, setSave] = useState(() => localSave.get());
  const [isGuest, setIsGuest] = useState(true);
  const [daily] = useState(() => getDailyPuzzle());
  const [unlimitedDifficulty, setUnlimitedDifficulty] = useState(() => localSave.get().lastUnlimitedDifficulty);
  const [unlimited, setUnlimited] = useState(() => getRandomPuzzle(undefined, unlimitedDifficulty));
  const [foundDaily, setFoundDaily] = useState(() => new Set());
  const [foundUnlimited, setFoundUnlimited] = useState(() => new Set());
  const [leaderboardKey, setLeaderboardKey] = useState(0);
  const [scoreStatus, setScoreStatus] = useState("idle");
  const [showAchievements, setShowAchievements] = useState(false);
  const [newlyUnlocked, setNewlyUnlocked] = useState(null);
  const [showConfetti, setShowConfetti] = useState(false);
  const [hintLettersUsed, setHintLettersUsed] = useState(0);
  const [hintWordsUsed, setHintWordsUsed] = useState(0);
  const [revealedCell, setRevealedCell] = useState(null);

  // A new daily puzzle resets its own progress and hints — each puzzle gets
  // its own 3 letter reveals + 1 word reveal.
  React.useEffect(() => {
    setFoundDaily(new Set());
    setHintLettersUsed(0);
    setHintWordsUsed(0);
    setRevealedCell(null);
  }, [daily.date]);

  // Dealing a fresh Classic Unlimited grid (new puzzle, or new difficulty)
  // resets that mode's own progress and hints independently of Daily's.
  React.useEffect(() => {
    setFoundUnlimited(new Set());
    setHintLettersUsed(0);
    setHintWordsUsed(0);
    setRevealedCell(null);
  }, [unlimited.date]);

  const active = mode === "daily" ? daily : unlimited;
  const found = mode === "daily" ? foundDaily : foundUnlimited;
  const setFound = mode === "daily" ? setFoundDaily : setFoundUnlimited;
  const isComplete = found.size === active.puzzle.words.length && active.puzzle.words.length > 0;
  const timerMs = useTimer(`${mode}:${active.date}:${active.difficulty}`, !isComplete && phase === "ready");

  const handleChoiceResolved = (opts) => {
    try { sessionStorage.setItem(PLAY_CHOICE_KEY, "true"); } catch (e) {}
    setIsGuest(opts.isGuest);
    if (opts.displayName) setSave(localSave.setDisplayName(opts.displayName));
    setPhase("ready");
  };

  const handleWordFound = (word) => {
    const next = new Set(found); next.add(word); setFound(next);
    if (mode === "daily" && next.size === daily.puzzle.words.length) {
      const prevUnlocked = save.unlockedAchievements;
      const updated = localSave.recordDailyWin(todayUtc(), daily.themeId, timerMs);
      setSave(updated);

      const newlyUnlockedIds = diffNewlyUnlocked(updated, THEMES.length, prevUnlocked);
      if (newlyUnlockedIds.length > 0) {
        localSave.setUnlockedAchievements([...prevUnlocked, ...newlyUnlockedIds]);
        setNewlyUnlocked(ACHIEVEMENTS.filter((a) => newlyUnlockedIds.includes(a.id)));
      }
      setShowConfetti(true);
      setTimeout(() => setShowConfetti(false), 1800);

      if (!isGuest && save.displayName) {
        setScoreStatus("saving");
        submitDailyScore(daily.date, daily.difficulty, save.displayName, timerMs)
          .then((ok) => { if (ok) { setScoreStatus("saved"); setLeaderboardKey((k) => k + 1); } else setScoreStatus("failed"); })
          .catch(() => setScoreStatus("failed"));
      }
    }
  };

  const handleSelectUnlimitedDifficulty = (difficulty) => {
    if (difficulty === unlimitedDifficulty) return;
    setUnlimitedDifficulty(difficulty);
    setSave(localSave.setLastUnlimitedDifficulty(difficulty));
    setUnlimited(getRandomPuzzle(undefined, difficulty));
  };

  const handleRevealLetter = () => {
    if (hintLettersUsed >= HINT_LETTER_LIMIT) return;
    const target = active.puzzle.words.find((w) => !found.has(w.word));
    if (!target) return;
    setRevealedCell({ row: target.row, col: target.col });
    setHintLettersUsed((n) => n + 1);
    setTimeout(() => setRevealedCell(null), 1500);
  };

  const handleRevealWord = () => {
    if (hintWordsUsed >= HINT_WORD_LIMIT) return;
    const target = active.puzzle.words.find((w) => !found.has(w.word));
    if (!target) return;
    setHintWordsUsed((n) => n + 1);
    handleWordFound(target.word);
  };

  const newUnlimitedPuzzle = () => {
    setUnlimited(getRandomPuzzle(undefined, unlimitedDifficulty));
  };
  const handleUnlock = () => alert("Payments aren't set up yet — Classic Unlimited will unlock for $2 once that's wired in.");
  const locked = mode === "unlimited" && !save.unlockedUnlimited;

  if (phase === "choice") return <ChoiceScreen onResolved={handleChoiceResolved} />;

  return (
    <div className="screen">
      <header className="header">
        <div className="brand"><WordmarkTiles /><h1>Wordezy Search</h1></div>
        <div className="header-right">
          {!locked && <div className="timer"><TimerIcon size={16} />{formatTime(timerMs)}</div>}
          {!locked && mode === "daily" && save.bestDailyTimeMs != null && (
            <div className="best-time" title="Best daily time">
              Best {formatTime(save.bestDailyTimeMs)}
            </div>
          )}
          {save.streak > 0 && <div className="streak"><FlameIcon size={16} />{save.streak}</div>}
          <button type="button" className="achievements-btn" onClick={() => setShowAchievements(true)} aria-label="Achievements">
            <AwardIcon size={16} />{save.unlockedAchievements.length}/{ACHIEVEMENTS.length}
          </button>
        </div>
      </header>

      {showConfetti && <Confetti durationMs={1800} />}
      {newlyUnlocked && newlyUnlocked.length > 0 && (
        <AchievementToastStack achievements={newlyUnlocked} onDone={() => setNewlyUnlocked(null)} />
      )}
      {showAchievements && <AchievementsModal save={save} onClose={() => setShowAchievements(false)} />}

      <div className="modes">
        <button type="button" onClick={() => setMode("daily")} className={`mode-btn ${mode === "daily" ? "active" : ""}`}>Daily</button>
        <button type="button" onClick={() => setMode("unlimited")} className={`mode-btn ${mode === "unlimited" ? "active" : ""}`}>
          {!save.unlockedUnlimited && <LockIcon size={14} />}
          Classic Unlimited
        </button>
      </div>

      {mode === "unlimited" && !locked && (
        <div className="difficulty-tabs">
          {DIFFICULTIES.map((d) => (
            <button
              key={d}
              type="button"
              onClick={() => handleSelectUnlimitedDifficulty(d)}
              className={`difficulty-btn ${unlimitedDifficulty === d ? "active" : ""}`}
            >
              {DIFFICULTY_LABELS[d]}
            </button>
          ))}
        </div>
      )}

      {locked ? (
        <div className="lock-card">
          <div className="lock-badge"><SparklesIcon size={22} /></div>
          <div>
            <h2>Classic Unlimited</h2>
            <p>Unlock endless puzzles across every theme — no daily limit, play as many as you want, whenever you want.</p>
          </div>
          <button type="button" onClick={handleUnlock} className="unlock-btn">Unlock for $2</button>
        </div>
      ) : (
        <>
          <div style={{ textAlign: "center" }}>
            <p className="theme-label">{active.themeLabel}</p>
            {isComplete && (
              <p className="complete-msg">
                Solved in {formatTime(timerMs)}
                {mode === "daily" && isGuest ? " — join the leaderboard next time to save this" : ""}
                {mode === "daily" && scoreStatus === "failed" ? " — saved locally only" : ""}
              </p>
            )}
          </div>
          <div className="board-row">
            <Grid puzzle={active.puzzle} foundWords={found} onWordFound={handleWordFound} revealedCell={revealedCell} />
            <div>
              <WordList words={active.puzzle.words} found={found} />
              {!isComplete && (
                <div className="hints">
                  <button type="button" className="hint-btn" onClick={handleRevealLetter} disabled={hintLettersUsed >= HINT_LETTER_LIMIT}>
                    <LightbulbIcon size={14} /> Reveal letter ({HINT_LETTER_LIMIT - hintLettersUsed} left)
                  </button>
                  <button type="button" className="hint-btn" onClick={handleRevealWord} disabled={hintWordsUsed >= HINT_WORD_LIMIT}>
                    <EyeIcon size={14} /> Reveal word ({HINT_WORD_LIMIT - hintWordsUsed} left)
                  </button>
                </div>
              )}
            </div>
          </div>
          {mode === "unlimited" && (
            <button type="button" onClick={newUnlimitedPuzzle} className="new-puzzle-btn">
              <RefreshIcon size={14} /> New puzzle
            </button>
          )}
          {mode === "daily" && <Leaderboard date={daily.date} difficulty={daily.difficulty} refreshKey={leaderboardKey} />}
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GamePage />);
</script>
